<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
      }

      p {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }

      /* Centered page container */
      .page-container {
        width: 90%;
        max-width: 42rem;
        margin: 2rem auto;
        background-color: #f6f2e9;
        padding: 2rem;
        border-radius: 8px;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #d9cdb9;
      }

      header img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        object-position: center;
        border-radius: 10px;
      }

      header h1 {
        font-family: Georgia, serif;
        color: #315647;
        text-align: center;
        font-size: 2.2rem;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: #a66c64;
        font-size: 0.75rem;
        letter-spacing: 3px;
        font-weight: bold;
        text-align: center;
      }

      header p {
        color: #52675c;
        font-size: 0.8rem;
        text-align: center;
      }

      .header-decoration {
        width: 220px;
        height: 130px;
        object-fit: contain;
        margin-bottom: 0.75rem;

        -webkit-mask-image: radial-gradient(
          ellipse,
          black 45%,
          transparent 100%
        );
        mask-image: radial-gradient(ellipse, black 45%, transparent 100%);
      }

      .content-container {
        padding: 0.5rem 1rem;
      }

      .form-label {
        color: #52675c;
        font-size: 0.75rem;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .dropdown {
        margin-bottom: 1rem;
        border-color: #d9cdb9;
      }

      #submitBtn {
        background-color: #315647;
        width: 100%;
        color: white;
        font-size: 1rem;
        padding: 0.65rem;
        border: none;
        border-radius: 6px;
      }

      #submitBtn:hover {
        background-color: #254638;
      }

      /* Results Section */
      #results {
        padding: 2rem;
        background-color: #fff;
        display: none;
      }
      .song-title {
        text-align: center;
      }
      .song-line {
        font-family: Georgia, serif;
        font-size: 1rem;
        color: #454b45;
        margin-bottom: 0.35rem;
        text-align: center;
      }

      .verse-space {
        height: 1.25rem;
      }

      .song-chords {
        text-align: center;
        color: #a66c64;
        font-weight: bold;
        border-top: 1px solid #e6dfd2;
        padding-top: 1rem;
        margin-top: 1.5rem;
      }
    </style>
  </head>

  <body>
    <div class="page-container">
      <header>
        <img
          src="images/christmas-fox.jpg"
          class="header-decoration"
          ="stars banner"
        />

        <p class="subtitle">A LITTLE CHRISTMAS MUSIC</p>
        <h1>Christmas Song Lyrics</h1>
        <p>A collection of favorite Christmas songs</p>
      </header>

      <div class="content-container">
        <!-- Dropdown -->
        <div>
          <label for="song" class="form-label">CHOOSE A SONG</label>

          <select id="song" class="dropdown form-select">
            <option value="">Select a song</option>
            <option value="silent-night">Silent Night</option>
            <option value="winter-wonderland">Winter Wonderland</option>
          </select>
        </div>

        <button id="submitBtn">Display Song</button>

        <!-- Empty container for rendered HTML -->
        <div id="results"></div>
      </div>
    </div>

    <script>
      // Data Object
      const songs = {
        "feliz-navidad": {
          title: "Feliz Navidad",
          lyrics: [
            "Feliz Navidad | Feliz Navidad | Feliz Navidad | Próspero año y felicidad",
            "Feliz Navidad | Feliz Navidad | Feliz Navidad | Próspero año y felicidad",
            "I wanna wish you a merry Christmas | I wanna wish you a merry Christmas | I wanna wish you a merry Christmas | From the bottom of my heart",
            "I wanna wish you a merry Christmas | I wanna wish you a merry Christmas | I wanna wish you a merry Christmas | From the bottom of my heart",
          ],
          chords: "",
        },
        "silent-night": {
          title: "Silent Night",
          lyrics: [
            "Silent night, holy night | All is calm, all is bright | Round yon Virgin, Mother and Child | Holy infant so tender and mild | Sleep in heavenly peace | Sleep in heavenly peace",
            "Noche de paz, noche de amor | Todo duerme en derredor | Entre los astros que esparcen su luz | bella anunciando al niñito Jesúss | brilla la estrella de paz | brilla la estrella de paz",
            "Silent night! Holy night | Shepherds quake at the sight | Glories stream from heaven afar | Heavenly hosts sing Alleluia | Christ, the Savior, is born | Christ, the Savior, is born!",
            "Noche de paz, noche de amor | Oye humilde, fiel pastor | coros celestes proclaman salud | gracias y glorias en gran plenitud | por nuestro buen Redentor | por nuestro buen Redentor",
            "Silent night! Holy night | Son of God, love's pure light | Radiant beams from thy holy face | With the dawn of redeeming grace | Jesus, Lord, at thy birth ] Jesus, Lord, at thy birth",
            "Noche de paz, noche de amor | Ved qué bello resplandor | Luce en el rostro del niño Jesús | en el pesebre, del mundo la Luz | astro de eterno fulgor | astro de eterno fulgor",
          ],
          chords: "G - D7 - G",
        },

        "winter-wonderland": {
          title: "Winter Wonderland",
          lyrics: [
            "Sleigh bells ring, are you listenin'? | In the lane, snow is glistenin' | A beautiful sight, we're happy tonight | Walkin' in a winter wonderland",
            "Gone away is the bluebird | Here to stay is a new bird | He sings a love song while we stroll along | Walking in a winter wonderland",
            "In the meadow, we can build a snowman | And pretend that he is Parson Brown | He'll say, are you married? | We'll say, no, man | But you could do the job when you're in town",
            "Later on, we'll conspire | As we dream by the fire | To face unafraid, the plans that we've made | Walking in a winter wonderland",
            "In the meadow, we can build a snowman | And pretend that he is Parson Brown | He'll say, are you married? | We'll say, no, man | But you could do the job when you're in town",
            "Later on, we'll conspire | As we dream by the fire | To face unafraid, the plans that we've made | Walking in a winter wonderland | Walking in a winter | onderland | Walking in a winter wonderland",
          ],
          chords: "G - D7 - G",
        }
      };

      // Listen for button click
      document
        .getElementById("submitBtn")
        .addEventListener("click", function () {
          const songChoice = document.getElementById("song").value;

          if (!songChoice) {
            document.getElementById("results").innerHTML =
              "<p>Please select a song.</p>";
            return;
          }

          const selectedSong = songs[songChoice];
          const lyricsArray = selectedSong.lyrics;

          let lyricsHTML = "";

          lyricsArray.forEach((verse) => {
            const lines = verse.split("|");

            lines.forEach((line) => {
              lyricsHTML += `<p class="song-line">${line.trim()}</p>`;
            });

            lyricsHTML += `<div class="verse-space"></div>`;
          });

          let songHTML = `
              <h2 class="song-title">${selectedSong.title}</h2>
              ${lyricsHTML}
              <p class="song-chords">${selectedSong.chords}</p>
          `;

          document.getElementById("results").innerHTML = songHTML;
          document.getElementById("results").style.display = "block";
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
